<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#f8f9fa" rx="12"/>

  <!-- Slider Container -->
  <g transform="translate(30, 40)">
    <!-- Shadow -->
    <rect x="2" y="2" width="340" height="220" fill="rgba(0,0,0,0.05)" rx="8"/>

    <!-- Container -->
    <rect width="340" height="220" fill="#fff" rx="8"/>

    <!-- Before Section (Left - Purple gradient) -->
    <defs>
      <linearGradient id="beforeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
      </linearGradient>
    </defs>
    <rect width="170" height="220" fill="url(#beforeGrad)" rx="8"/>

    <!-- After Section (Right - Pink gradient) -->
    <defs>
      <linearGradient id="afterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
      </linearGradient>
    </defs>
    <rect x="170" width="170" height="220" fill="url(#afterGrad)" rx="8"/>

    <!-- Handle Line -->
    <rect x="168.5" y="0" width="3" height="220" fill="white" opacity="0.95">
      <animate attributeName="opacity" values="0.95;1;0.95" dur="2s" repeatCount="indefinite"/>
    </rect>

    <!-- Handle Circle -->
    <circle cx="170" cy="110" r="20" fill="white" opacity="0.98">
      <animate attributeName="opacity" values="0.98;1;0.98" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Handle Arrows -->
    <g transform="translate(170, 110)" fill="#667eea">
      <!-- Left Arrow -->
      <path d="M -6,-3 L -10,0 L -6,3" stroke="#667eea" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Right Arrow -->
      <path d="M 6,-3 L 10,0 L 6,3" stroke="#667eea" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Before Label -->
    <rect x="16" y="16" width="58" height="24" fill="rgba(255,255,255,0.92)" rx="4"/>
    <text x="45" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#333" text-anchor="middle">Before</text>

    <!-- After Label -->
    <rect x="266" y="16" width="48" height="24" fill="rgba(255,255,255,0.92)" rx="4"/>
    <text x="290" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#333" text-anchor="middle">After</text>
  </g>
</svg>
